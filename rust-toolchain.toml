# Pinned because the trybuild snapshots in tests/ui/*.stderr contain rustc's
# exact diagnostic wording. When bumping, regenerate them with
# `TRYBUILD=overwrite cargo test --test compile_fail` and review the diff.
[toolchain]
channel = "1.93.0"
# rust-src: without it, rustc can't quote the standard library's source in
# diagnostics, and the snapshots that do would mismatch.
components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"]
profile = "minimal"
