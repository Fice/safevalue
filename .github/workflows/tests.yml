name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compile-fail snapshots (tests/ui/*.stderr) depend on the exact
      # rustc version pinned there.
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: cargo build --verbose
      - name: Run unit, doc and compile-fail tests
        run: cargo test --verbose
