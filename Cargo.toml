[package]
name = "safevalue"
version = "0.4.1"
edition = "2024"
authors = ["Marcel Lambert <marcel_lambert@ymail.com>"]
keywords = ["unsafe", "safe", "utility", "no_std", "derive"]
categories = ["no-std", "rust-patterns"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fice/safevalue"
readme = "README.md"
documentation = "https://docs.rs/safevalue"
homepage = "https://crates.io/crates/safevalue"
description = "A value based approach to uphold SAFETY requirements for unsafe Rust code."
exclude = [".github"]
rust-version = "1.85"

[workspace]
members = ["safevalue-derive"]

[features]
# MarkerData for alloc's types: String, Vec, Box, Rc, Arc, collections, ...
alloc = []
# MarkerData for std's types as well: HashMap, HashSet, PathBuf, OsString.
std = ["alloc"]

[dependencies]
pastey = "0.2.3"
safevalue-derive = { version = "=0.4.0", path = "safevalue-derive" }

[dev-dependencies]
trybuild = "1.0.121"

[package.metadata.docs.rs]
all-features = true
